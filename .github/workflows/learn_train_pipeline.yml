name: Learn Weekly Training

on:
  schedule:
    # Sunday 23:30 UTC -- after that day's daily pipeline run (22:00 UTC),
    # so training reads a Gold table already refreshed with the full week.
    - cron: '30 23 * * 0'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn psycopg2-binary python-dotenv tzdata

      - name: Train and evaluate (learn/train_copy_version.py)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRICE_AREA: ${{ vars.PRICE_AREA }}
          STATION_ID: ${{ vars.STATION_ID }}
          TARGET: ${{ vars.TARGET }}
        run: python learn/train_copy_version.py

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: learn/model_copy_version.pkl
          retention-days: 90
