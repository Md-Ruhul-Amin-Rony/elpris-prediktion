name: Daily Data Ingestion

on:
  schedule:
  
    - cron: '0 22 * * *'
  
  workflow_dispatch:
  
    inputs:
      days:
        description: 'Number of days to ingest'
        required: false
        default: '7'
        type: string

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn requests psycopg2-binary python-dotenv tzdata

      - name: Run ingestion script
        env:
          # Pulls the database connection string securely from GitHub Secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Pulls non-sensitive config from GitHub Action Variables
          PRICE_AREA: ${{ vars.PRICE_AREA }}
          STATION_ID: ${{ vars.STATION_ID }}
        run: |
          # Uses the manual input if provided, otherwise defaults to 7 days
          DAYS_ARG="${{ github.event.inputs.days || '7' }}"
          python daily_ingest.py --days $DAYS_ARG

      - name: Refresh daily feature table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRICE_AREA: ${{ vars.PRICE_AREA }}
          STATION_ID: ${{ vars.STATION_ID }}
        run: |
          python feature_pipeline.py