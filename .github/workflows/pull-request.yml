name: Pull request checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, review_requested]
  pull_request_review:
    branches:
      - main
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: |
          if find . -path './.venv' -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            uv run pytest
          else
            echo "No test files found; skipping pytest."
          fi

  independent-review:
    name: Independent review required
    runs-on: ubuntu-latest
    steps:
      - name: Check for approval from a non-author
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              },
            );

            const latestReviewByUser = new Map();
            for (const review of reviews) {
              if (review.user?.login) {
                latestReviewByUser.set(review.user.login, review.state);
              }
            }

            const author = pullRequest.user.login;
            const approvedBy = [...latestReviewByUser.entries()]
              .filter(([login, state]) => login !== author && state === "APPROVED")
              .map(([login]) => login);

            if (approvedBy.length === 0) {
              core.setFailed(
                `An approval from someone other than ${author} is required before merging.`,
              );
              return;
            }

            core.info(`Approved by: ${approvedBy.join(", ")}`);